[package]
name = "physio_core"
version = "0.1.0"
edition = "2021"
authors = ["PhysioTracker Team"]
description = "High-performance WebAssembly Kinematic Engine for PhysioTracker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
