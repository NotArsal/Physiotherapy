version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - physio_network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - physio_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/physio_db
      - REDIS_URI=redis://redis:6379
      - FLASK_ENV=development
      - PORT=5000
    depends_on:
      - mongodb
      - redis
    networks:
      - physio_network
    # Use bind mounts for live reload during dev
    volumes:
      - ./backend:/app
    command: flask run --host=0.0.0.0 --port=5000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    networks:
      - physio_network
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

volumes:
  mongodb_data:

networks:
  physio_network:
    driver: bridge
