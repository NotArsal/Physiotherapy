backend:
  replicaCount: 2
  image:
    repository: physiotherapy-backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 5000
  env:
    FRONTEND_URL: "https://physiotherapy-frontend.vercel.app"
    PORT: "5000"
  secretEnv:
    MONGO_URI: "" # To be provided securely before deployment

frontend:
  replicaCount: 2
  image:
    repository: physiotherapy-frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: LoadBalancer
    port: 80
  buildArgs:
    REACT_APP_API_BASE_URL: "http://localhost:5000" # Placeholder, update depending on ingress/loadbalancer
