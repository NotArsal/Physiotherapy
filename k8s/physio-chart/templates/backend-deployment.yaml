apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "physio-chart.fullname" . }}-backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: MONGO_URI
              value: {{ .Values.backend.env.MONGO_URI | quote }}
            - name: FIREBASE_CREDENTIALS
              value: {{ .Values.backend.env.FIREBASE_CREDENTIALS | quote }}
            # Support external DATABASE_URL if user prefers PostgreSQL/SQLite later
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseSecret.name }}
                  key: database-url
                  optional: true
          volumeMounts:
            - name: firebase-secret
              mountPath: "/etc/secrets/firebase"
              readOnly: true
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: firebase-secret
          secret:
            secretName: {{ .Values.firebaseSecret.name }}
            optional: true
